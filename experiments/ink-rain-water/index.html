  <div class="shell">

    <main>

      <div class="entries">
        <article><time datetime="2026-10-21">2026.10.21</time><h2>从这一页开始</h2><p>给文字留一处安静的地方，放下日常的片段。</p></article>
        <article><time datetime="2026-10-18">2026.10.18</time><h2>记录，让想法慢慢清晰</h2><p>把它写下来，留待另一天重新阅读。</p></article>
      </div>
    </main>
    <footer><span>独立动效实验 · 宣纸与雨水</span><button id="motion" type="button" aria-pressed="true">暂停细雨</button></footer>
